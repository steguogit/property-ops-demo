# Launch the Property Operations Assistant as a container.
#
#   docker compose up -d --build     # build + start in the background
#   docker compose logs -f           # watch logs
#   docker compose down              # stop
#
# The app then serves at http://localhost:3100 and restarts automatically
# (including on machine reboot) unless you explicitly `docker compose down`.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: property-ops-demo:latest
    container_name: property-ops-demo
    # Load your existing secrets/config. Copy .env.example to .env first.
    env_file:
      - .env
    ports:
      - "3100:3100"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3100/api/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
