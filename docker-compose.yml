# Launch the Property Operations Assistant as a container, alongside the
# PaddleOCR microservice (a SEPARATE container built from ./ocr-service).
#
#   docker compose up -d --build     # build + start BOTH services in background
#   docker compose logs -f           # watch logs (both services)
#   docker compose logs -f ocr       # just the OCR service
#   docker compose down              # stop both
#
# The app serves at http://localhost:3100 and the OCR service at
# http://localhost:8001. Both restart automatically (including on reboot) unless
# you explicitly `docker compose down`.
#
# Note: the two containers use DIFFERENT images by necessity — the app image is
# Node/Next.js, the OCR image is Python (paddlepaddle has no wheels for the app's
# runtime). They share the compose network so the app calls the OCR service by
# its service name: OCR_SERVICE_URL=http://ocr:8001/ocr.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: property-ops-demo:latest
    container_name: property-ops-demo
    # Load your existing secrets/config. Copy .env.example to .env first.
    env_file:
      - .env
    ports:
      - "3100:3100"
    restart: unless-stopped
    # host.docker.internal still resolves (works on Docker Desktop; also fixes
    # Linux) in case you'd rather point OCR_SERVICE_URL at a host-run service.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Start after the OCR service is healthy. The app also degrades gracefully
    # (falls back to local OCR) if the service is unavailable at runtime.
    depends_on:
      ocr:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3100/api/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # PaddleOCR microservice — its own Python container. The Node app reaches it at
  # http://ocr:8001/ocr over the compose network (set in .env).
  ocr:
    build:
      context: ./ocr-service
      dockerfile: Dockerfile
    image: property-ops-ocr:latest
    container_name: property-ops-ocr
    environment:
      # Container-internal port; keep in sync with OCR_SERVICE_URL (http://ocr:8001/ocr).
      OCR_SERVICE_PORT: "8001"
    # Expose to the host too, so `npm run dev` (outside Docker) can also use it.
    ports:
      - "8001:8001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      # Model load can take a bit on first boot even though models are baked in.
      start_period: 40s
