name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  # ------------------------------------------------------------------
  # Typecheck, lint, unit tests, and a production build. These run
  # without any secrets — the app reads MONGODB/LLM/Voyage config only
  # at request time, not at build time.
  # ------------------------------------------------------------------
  verify:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

  # ------------------------------------------------------------------
  # Validate the Docker image builds (Dockerfile + Next standalone
  # output + bundled OCR/PDF native deps). No push — build only.
  # ------------------------------------------------------------------
  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: false
          tags: property-ops-demo:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
